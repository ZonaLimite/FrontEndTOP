<span class="rechazos-titulo">ÚLTIMOS RECHAZOS</span>
<div class="rechazos-lista" [style.--rechazos-items]="items">
  <!-- El más reciente abajo, destacado; trackBy por id: cada rechazo nuevo es un elemento nuevo y destella -->
  <div *ngFor="let r of ultimos() | slice:-items; trackBy: trackByRechazo; last as ultimo"
       class="rechazo-item"
       [class.rechazo-ultimo]="ultimo"
       [title]="(r.timestamp | date:'HH:mm:ss') + ' · ' + r.denominacion + (r.info ? ' · ' + r.info : '')">
    {{ r.denominacion }}
  </div>
</div>
