<div class="modulo-container" [class.orientacion-horizontal]="config.orientacion === 'horizontal'"
     [class.orientacion-vertical]="config.orientacion === 'vertical'">
  
  <!-- Etiqueta del módulo 
  <div class="modulo-header">
    <h4 class="modulo-titulo">{{ config.nombre }}</h4>
    <span class="modulo-id">ID: {{ config.id }}</span>
  </div>-->

  <!-- Área de fotocélulas con posicionamiento absoluto -->
  <div class="modulo-fotocelulas"
       [style.width.px]="config.ancho"
       [style.height.px]="config.alto">
    
    <!-- Grid de fondo para referencia visual (opcional) -->
    <!--<div class="grid-background"></div>-->
    
    <!-- Renderizar cada fotocélula en sus coordenadas -->
    <div *ngFor="let fotocelulaConfig of config.fotocelulas; trackBy: trackByFotocelula" 
         [style.left.%]="fotocelulaConfig.x"
         [style.top.%]="fotocelulaConfig.y"
         class="fotocelula-wrapper">
      
      <!-- ✅ fotocelulaId, moduloId y moduloNombre correctamente enlazados -->
      <app-fotocelula
        [fotocelulaId]="fotocelulaConfig.id"
        [nombreFotocelula]="fotocelulaConfig.nombre"
        [moduloId]="config.id"
        [moduloNombre]="config.nombre"
        [tamano]="fotocelulaConfig.tamano || 'normal'"
        [ocultado]="false"
        [orientacion]="fotocelulaConfig.orientacion || 'column'">
      </app-fotocelula>
      
      <!-- Marcador de posición (opcional, para debugging) -->
      <div class="position-marker" title="X: {{fotocelulaConfig.x}}%, Y: {{fotocelulaConfig.y}}%"></div>

    </div>

    <!-- Etiqueta de espesor (solo módulos feeder con etiquetaEspesor en su config) -->
    <div *ngIf="config.etiquetaEspesor as et"
         class="espesor-bloque"
         [style.left.%]="et.x"
         [style.top.%]="et.y">
      <span class="espesor-titulo">ESPESOR</span>
      <div class="etiqueta-espesor"
           [ngClass]="'estado-' + (medidaEspesor()?.estado ?? 'sin-lectura')">
        <ng-container *ngIf="medidaEspesor() as m; else sinLectura">
          {{ m.mm | number:'1.' + (et.decimales ?? 1) + '-' + (et.decimales ?? 1) }} mm
        </ng-container>
        <ng-template #sinLectura>— mm</ng-template>
      </div>
    </div>

    <!-- Etiquetas de destino (solo módulos ACQ): OCR arriba y restitución abajo; solo la del último envío tiene lectura -->
    <ng-container *ngIf="config.etiquetaOcr as eo"
                  [ngTemplateOutlet]="etiquetaDestino"
                  [ngTemplateOutletContext]="{ pos: eo, titulo: 'DESTINO (OCR)', lectura: lecturaOcr(), pulso: pulsoOcr() }">
    </ng-container>
    <ng-container *ngIf="config.etiquetaRestitucion as er"
                  [ngTemplateOutlet]="etiquetaDestino"
                  [ngTemplateOutletContext]="{ pos: er, titulo: 'RESTITUCIÓN', lectura: lecturaRestitucion(), pulso: pulsoRestitucion() }">
    </ng-container>

    <!-- Título con LED + recuadro: el LED destella y el contenido parpadea en cada lectura (no al vaciarse) -->
    <ng-template #etiquetaDestino let-pos="pos" let-titulo="titulo" let-lectura="lectura" let-pulso="pulso">
      <div class="lectura-bloque"
           [style.left.%]="pos.x"
           [style.top.%]="pos.y">
        <span class="lectura-titulo">
          <span class="lectura-led"
                [ngClass]="'estado-' + (lectura?.estado ?? 'sin-lectura')"
                [class.pulso-a]="lectura && pulso === 'a'"
                [class.pulso-b]="lectura && pulso === 'b'"></span>
          {{ titulo }}
        </span>
        <div class="etiqueta-lectura"
             [ngClass]="'estado-' + (lectura?.estado ?? 'sin-lectura')"
             [class.pulso-a]="lectura && pulso === 'a'"
             [class.pulso-b]="lectura && pulso === 'b'">
          <ng-container *ngIf="lectura; else sinLecturaDestino">
            <ng-container *ngIf="lectura.cp; else noReconocido">
              <span class="lectura-cp">{{ lectura.cp }}<ng-container *ngIf="lectura.distribucion"> {{ lectura.distribucion }}</ng-container></span>
              <!-- Solo el OCR da el destino en texto -->
              <span *ngIf="lectura.origen === 'ocr'" class="lectura-texto" [title]="lectura.texto">{{ lectura.texto || '—' }}</span>
            </ng-container>
            <ng-template #noReconocido><span class="lectura-aviso">NO RECONOCIDO</span></ng-template>
          </ng-container>
          <ng-template #sinLecturaDestino><span class="lectura-cp">—</span></ng-template>
        </div>
      </div>
    </ng-template>

    <!-- Lista de últimos rechazos (solo módulos CUL con listaRechazos) -->
    <app-lista-rechazos *ngIf="config.listaRechazos as lr"
                        [style.left.%]="lr.x"
                        [style.top.%]="lr.y"
                        [items]="lr.items ?? 3">
    </app-lista-rechazos>

  </div>

  <!-- Footer con información -->
  <div class="modulo-footer">
    <span class="info-text">
     {{config.id}} 
     </span>
  </div>

</div>
